<svg width="360" height="96" viewBox="0 0 360 96" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueOuter" x1="18" y1="8" x2="342" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155E9C"/>
      <stop offset="0.25" stop-color="#0C3D71"/>
      <stop offset="0.55" stop-color="#07264D"/>
      <stop offset="0.8" stop-color="#041832"/>
      <stop offset="1" stop-color="#020A18"/>
    </linearGradient>

    <linearGradient id="blueInner" x1="28" y1="16" x2="332" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A6DAF"/>
      <stop offset="0.3" stop-color="#0F4A82"/>
      <stop offset="0.65" stop-color="#082D5A"/>
      <stop offset="1" stop-color="#041832"/>
    </linearGradient>

    <linearGradient id="goldStroke" x1="22" y1="10" x2="338" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D6"/>
      <stop offset="0.35" stop-color="#FFD166"/>
      <stop offset="0.7" stop-color="#C77A10"/>
      <stop offset="1" stop-color="#6F3700"/>
    </linearGradient>

    <linearGradient id="topShine" x1="34" y1="16" x2="324" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="buttonShadow" x="0" y="0" width="360" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- bottom depth -->
  <rect x="18" y="24" width="324" height="58" rx="25" fill="#020A18"/>

  <!-- outer body -->
  <rect x="18" y="12" width="324" height="58" rx="25" fill="url(#blueOuter)" filter="url(#buttonShadow)"/>

  <!-- inner body -->
  <rect x="26" y="18" width="308" height="44" rx="19" fill="url(#blueInner)"/>

  <!-- gold stroke -->
  <rect x="22" y="16" width="316" height="50" rx="21" stroke="url(#goldStroke)" stroke-width="4"/>

  <!-- inner stroke -->
  <rect x="32" y="22" width="296" height="38" rx="16" stroke="#5B9BD5" stroke-opacity="0.2" stroke-width="2"/>

  <!-- glossy shine -->
  <path d="M32 22H328C330 22 332 24 332 26V34C332 34 196 20 172 20C148 20 28 34 28 34V26C28 24 30 22 32 22Z" fill="url(#topShine)"/>
</svg>
