<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillBg" x1="0" y1="0" x2="220" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071724"/>
      <stop offset="1" stop-color="#02090F"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3D37D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8A6622" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Background with slight depth -->
  <rect x="1" y="1" width="218" height="46" rx="23" fill="url(#pillBg)"/>
  <!-- Shiny inner gold border -->
  <rect x="1.5" y="1.5" width="217" height="45" rx="22.5" stroke="url(#pillBorder)" stroke-width="2"/>
</svg>
