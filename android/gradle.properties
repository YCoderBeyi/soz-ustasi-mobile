android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
android.r8.optimizedResourceShrinking=false
# Native OOM during R8 on JDK 23: smaller heap + uncompressed oops frees low 4GB native space.
org.gradle.jvmargs=-Xmx1536m -Xms256m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:CICompilerCount=2 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
